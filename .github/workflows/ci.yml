name: CI

# ORC-006: minimal GITHUB_TOKEN permissions (read-only).
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch/PR (ORC-006).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      # ORC-006: actions pinned to full commit SHA with tag comment.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked)  # ORC-003
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Mypy type-check
        run: uv run mypy src

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked)  # ORC-003
        run: uv sync --locked --extra dev

      - name: Run tests
        run: >
          uv run pytest tests/
          -m "not gpu and not e2e"
          --cov=orchestrator
          --cov-report=term
          --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: Dependency security audit  # ORC-006
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --locked --extra dev

      - name: Run pip-audit on lockfile
        run: uv run --with pip-audit pip-audit --strict

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (no push)
        run: docker buildx build -f docker/Dockerfile -t orchestrator:ci .
