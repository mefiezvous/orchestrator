name: CI

# ORC-006: minimal GITHUB_TOKEN permissions (read-only).
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch/PR (ORC-006).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      # ORC-006: actions pinned to full commit SHA with tag comment.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked)  # ORC-003
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Mypy type-check
        run: uv run mypy src

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked)  # ORC-003
        run: uv sync --locked --extra dev

      - name: Run tests
        run: >
          uv run pytest tests/
          -m "not gpu and not e2e"
          --cov=orchestrator
          --cov-report=term
          --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: Dependency security audit  # ORC-006
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --locked --extra dev

      - name: Run pip-audit on lockfile
        # --skip-editable: orchestrator itself is an editable install, not on
        # PyPI, so pip-audit cannot audit it; skip it and audit third-party
        # deps only. --strict is intentionally omitted: combined with
        # --skip-editable it would convert the editable-skip warning into a
        # fatal error, which defeats the purpose of --skip-editable.
        run: uv run --with pip-audit pip-audit --skip-editable

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image (no push)
        run: docker buildx build -f docker/Dockerfile -t orchestrator:ci .
