[project]
name = "orchestrator"
version = "0.1.0"
description = "Local HTTP orchestrator for the robotics workspace (FastAPI + RQ + SQLite + SSE)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Arthur Mouraud" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "rq>=2.0",
    "redis>=5.2",
    "loguru>=0.7",
    "watchdog>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.3",
    "mlflow-skinny>=2.18",
    "slowapi>=0.1.9",
    "starlette>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "fakeredis>=2.26",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-pyyaml",
    "anyio>=4.6",
]

[project.scripts]
orchestrator = "orchestrator.cli.__main__:main"
orchestrator-worker = "orchestrator.worker.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["orchestrator"]
exclude = ["tests/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["rq.*", "fakeredis.*", "mlflow.*", "watchdog.*", "sse_starlette.*", "slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: pure unit tests",
    "integration: tests with fakeredis + tmp filesystem",
    "e2e: end-to-end via docker compose (slow)",
    "gpu: requires CUDA",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/orchestrator"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 70
show_missing = true
skip_covered = false
