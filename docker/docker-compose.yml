# SPDX-License-Identifier: Apache-2.0
# docker-compose.yml — invoke from repo root:
#   docker compose -f docker/docker-compose.yml up -d
# Relative paths (../) are resolved from this file's directory (orchestrator/docker/).
# ../../<repo>  →  robotics-workspace/<repo>   (sibling repos in the workspace)
# ../<path>     →  orchestrator/<path>
#
# Host workspace location is parameterized via ${WORKSPACE_HOST_PATH} (default: ../..).
# To run with a non-default workspace layout (e.g. cloned elsewhere on host):
#   WORKSPACE_HOST_PATH=/abs/path/to/workspace docker compose up -d
# See docs/RUNBOOK.md → "Custom workspace layout".

name: orchestrator

services:

  # ---------------------------------------------------------------------------
  redis:
  # ---------------------------------------------------------------------------
    image: redis:7-alpine
    restart: unless-stopped
    # ORC-005: run as non-root, drop all capabilities, no new privileges.
    user: "999:999"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 512m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  mlflow:
  # ---------------------------------------------------------------------------
    image: ghcr.io/mlflow/mlflow:v2.18.0
    restart: unless-stopped
    # ORC-005: run as non-root, drop all capabilities, no new privileges.
    user: "1000:1000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 1g
    ports:
      - "${MLFLOW_HOST:-127.0.0.1}:${MLFLOW_PORT:-5000}:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: file:///mlruns
    volumes:
      - ../data/mlruns:/mlruns
    command: >
      mlflow ui
        --backend-store-uri file:///mlruns
        --host 0.0.0.0
        --port 5000

  # ---------------------------------------------------------------------------
  api:
  # ---------------------------------------------------------------------------
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: orchestrator:0.1.0
    restart: unless-stopped
    # ORC-005: run as non-root (uid 1000 created in Dockerfile), drop all
    # capabilities, prevent privilege escalation, read-only root filesystem.
    user: "1000:1000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    mem_limit: 4g
    ports:
      - "${API_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    env_file: ../.env
    environment:
      WORKSPACE_ROOT: /workspace
      LEROBOT_REPO: /workspace/lerobot-playground-portfolio
      ROBOT_SPECS_DIR: /workspace/lerobot-playground-portfolio/robot_specs
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/runs.db
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: file:///data/mlruns
    volumes:
      # Sibling repos: always read-only for the API service (never writes).
      - ${WORKSPACE_HOST_PATH:-../..}/lerobot-playground-portfolio:/workspace/lerobot-playground-portfolio:ro
      - ${WORKSPACE_HOST_PATH:-../..}/ml-core:/workspace/ml-core:ro
      - ${WORKSPACE_HOST_PATH:-../..}/robotics-platform-template:/workspace/robotics-platform-template:ro
      # ADR-004: scoped RW override for /api/v1/robots (declare/branch robots).
      # The only writable path for this service — pure YAML, no code/config
      # execution. read_only: true above still applies to everything else.
      - ${WORKSPACE_HOST_PATH:-../..}/lerobot-playground-portfolio/robot_specs:/workspace/lerobot-playground-portfolio/robot_specs
      - ../data:/data
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    command: >
      uvicorn orchestrator.api.main:app
        --host 0.0.0.0
        --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  worker:
  # ---------------------------------------------------------------------------
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: orchestrator:0.1.0
    restart: unless-stopped
    # ORC-005: run as non-root, drop all capabilities, no new privileges.
    # read_only is not set here because the worker writes checkpoints/datasets
    # to the sibling repo mount — tmpfs covers /tmp only.
    user: "1000:1000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    pids_limit: 512
    mem_limit: 8g
    env_file: ../.env
    environment:
      WORKSPACE_ROOT: /workspace
      LEROBOT_REPO: /workspace/lerobot-playground-portfolio
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/runs.db
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: file:///data/mlruns
    volumes:
      # ORC-005: worker writes datasets/checkpoints only to lerobot-playground-portfolio
      # and ml-core; robotics-platform-template is read-only (config only).
      # Bind only the specific subdirs that actually need write access (RW).
      - ${WORKSPACE_HOST_PATH:-../..}/lerobot-playground-portfolio:/workspace/lerobot-playground-portfolio
      - ${WORKSPACE_HOST_PATH:-../..}/ml-core:/workspace/ml-core:ro
      - ${WORKSPACE_HOST_PATH:-../..}/robotics-platform-template:/workspace/robotics-platform-template:ro
      - ../data:/data
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/entrypoint-worker.sh"]
    command: ["orchestrator-worker"]

volumes:
  redis_data:
