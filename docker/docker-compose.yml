# SPDX-License-Identifier: Apache-2.0
# docker-compose.yml — invoke from repo root:
#   docker compose -f docker/docker-compose.yml up -d
# Relative paths (../) are resolved from this file's directory (orchestrator/docker/).
# ../../<repo>  →  robotics-workspace/<repo>   (sibling repos in the workspace)
# ../<path>     →  orchestrator/<path>
#
# Host workspace location is parameterized via ${WORKSPACE_HOST_PATH} (default: ../..).
# To run with a non-default workspace layout (e.g. cloned elsewhere on host):
#   WORKSPACE_HOST_PATH=/abs/path/to/workspace docker compose up -d
# See docs/RUNBOOK.md → "Custom workspace layout".

name: orchestrator

services:

  # ---------------------------------------------------------------------------
  redis:
  # ---------------------------------------------------------------------------
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  mlflow:
  # ---------------------------------------------------------------------------
    image: ghcr.io/mlflow/mlflow:v2.18.0
    restart: unless-stopped
    ports:
      - "${MLFLOW_HOST:-127.0.0.1}:${MLFLOW_PORT:-5000}:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: file:///mlruns
    volumes:
      - ../data/mlruns:/mlruns
    command: >
      mlflow ui
        --backend-store-uri file:///mlruns
        --host 0.0.0.0
        --port 5000

  # ---------------------------------------------------------------------------
  api:
  # ---------------------------------------------------------------------------
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: orchestrator:0.1.0
    restart: unless-stopped
    ports:
      - "${API_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    env_file: ../.env
    environment:
      WORKSPACE_ROOT: /workspace
      LEROBOT_REPO: /workspace/lerobot-playground-portfolio
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/runs.db
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: file:///data/mlruns
    volumes:
      - ${WORKSPACE_HOST_PATH:-../..}/lerobot-playground-portfolio:/workspace/lerobot-playground-portfolio:ro
      - ${WORKSPACE_HOST_PATH:-../..}/ml-core:/workspace/ml-core:ro
      - ${WORKSPACE_HOST_PATH:-../..}/robotics-platform-template:/workspace/robotics-platform-template:ro
      - ../data:/data
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    command: >
      uvicorn orchestrator.api.main:app
        --host 0.0.0.0
        --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  worker:
  # ---------------------------------------------------------------------------
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: orchestrator:0.1.0
    restart: unless-stopped
    env_file: ../.env
    environment:
      WORKSPACE_ROOT: /workspace
      LEROBOT_REPO: /workspace/lerobot-playground-portfolio
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/runs.db
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: file:///data/mlruns
    volumes:
      # RW: worker may write datasets/checkpoints to sibling repo data dirs
      - ${WORKSPACE_HOST_PATH:-../..}/lerobot-playground-portfolio:/workspace/lerobot-playground-portfolio
      - ${WORKSPACE_HOST_PATH:-../..}/ml-core:/workspace/ml-core
      - ${WORKSPACE_HOST_PATH:-../..}/robotics-platform-template:/workspace/robotics-platform-template:ro
      - ../data:/data
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/entrypoint-worker.sh"]
    command: ["orchestrator-worker"]

volumes:
  redis_data:
